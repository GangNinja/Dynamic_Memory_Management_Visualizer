<!DOCTYPE html>
<html lang="en">
<head>
  <title>Advanced Memory Management Simulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="glass-container">
    <header class="glass-header">
      <div class="logo">
        <i class="fas fa-microchip"></i>
        <h1>MemorySim Pro</h1>
      </div>
      <div class="header-controls">
        <button class="icon-btn" onclick="resetAll()" title="Reset All"><i class="fas fa-sync-alt"></i></button>
        <label class="dark-toggle">
          <i class="fas fa-moon"></i>
          <input type="checkbox" id="darkToggle" onchange="toggleDarkMode()">
        </label>
        <button class="icon-btn" onclick="exportStats()" title="Export"><i class="fas fa-download"></i></button>
      </div>
    </header>

    <div class="main-content">
      <div class="sidebar">
        <div class="control-panel">
          <h3><i class="fas fa-cogs"></i> Quick Actions</h3>
          <button class="action-btn primary" onclick="demoAlloc()">Demo Alloc <i class="fas fa-play"></i></button>
          <button class="action-btn" onclick="fullDemo()">Full Demo (10s)</button>
          <div class="slider-group">
            <label>Demo Speed</label>
            <input type="range" id="speedSlider" min="500" max="3000" value="1500">
            <span id="speedValue">1.5s</span>
          </div>
        </div>
      </div>

      <div class="content-area">
        <div class="tabs-header">
          <button class="tab-btn active" onclick="showTab('alloc')">
            <i class="fas fa-memory"></i> Dynamic Alloc
          </button>
          <button class="tab-btn" onclick="showTab('paging')">
            <i class="fas fa-table"></i> Paging
          </button>
          <button class="tab-btn" onclick="showTab('stackheap')">
            <i class="fas fa-layer-group"></i> Stack/Heap
          </button>
          <button class="tab-btn" onclick="showTab('gc')">
            <i class="fas fa-recycle"></i> Garbage Collection
          </button>
          <button class="tab-btn" onclick="showTab('dashboard')">
            <i class="fas fa-chart-bar"></i> Analytics
          </button>
        </div>

        <main class="tabs-container">
          <section id="alloc" class="tab-panel active">
            <div class="card">
              <h3>Dynamic Memory Allocation</h3>
              <div class="input-grid">
                <div class="input-group">
                  <label>PID</label>
                  <input id="pid" value="P1">
                </div>
                <div class="input-group">
                  <label>Size</label>
                  <input id="psize" type="number" value="50">
                </div>
                <div class="input-group">
                  <label>Algorithm</label>
                  <select id="algorithm">
                    <option value="first">First Fit</option>
                    <option value="best">Best Fit</option>
                    <option value="worst">Worst Fit</option>
                    <option value="next">Next Fit</option>
                  </select>
                </div>
              </div>
              <div class="action-buttons">
                <button onclick="allocate()" class="btn-primary"><i class="fas fa-plus"></i> Allocate</button>
                <button onclick="deallocate()" class="btn-secondary"><i class="fas fa-trash"></i> Deallocate</button>
                <button onclick="compact()" class="btn-accent"><i class="fas fa-compress"></i> Compact</button>
              </div>
              <div class="memory-stats">
                <div class="stat-item">
                  <span>Total Memory:</span>
                  <input id="totalMemory" type="number" value="1024" style="width: 80px;">
                  <button onclick="resetMemory()" class="btn-small">Reset</button>
                </div>
              </div>
              <div class="memory-visualizer">
                <div id="memoryContainer" class="memory-grid"></div>
              </div>
              <div class="frag-stats">
                <span id="internalFrag" class="stat">Internal Frag: 0</span>
                <span id="externalFrag" class="stat">External Free: 1024</span>
              </div>
            </div>
          </section>

          <section id="paging" class="tab-panel">
            <div class="card">
              <h3>Paging Algorithms</h3>
              <div class="input-grid">
                <div class="input-group">
                  <label>PID</label>
                  <input id="pagePid" value="P1">
                </div>
                <div class="input-group">
                  <label>Logical Page</label>
                  <input id="logicalPage" type="number" value="0">
                </div>
                <div class="input-group">
                  <label>Page Size</label>
                  <input id="frameSize" type="number" value="4" readonly>
                </div>
              </div>
              <div class="action-buttons">
                <button onclick="allocatePage(document.getElementById('pagePid').value, parseInt(document.getElementById('logicalPage').value))" class="btn-primary">
                  <i class="fas fa-map"></i> Map Page
                </button>
                <button onclick="initPaging()" class="btn-secondary"><i class="fas fa-sync"></i> Reset Paging</button>
              </div>
              <div id="pagingView"></div>
            </div>
          </section>

          <section id="stackheap" class="tab-panel">
            <div class="card-row">
              <div class="card">
                <h4>Stack</h4>
                <div class="input-group">
                  <input id="stackInput" value="10" placeholder="Value">
                  <button onclick="pushStack()" class="btn-small primary">Push</button>
                  <button onclick="popStack()" class="btn-small danger">Pop</button>
                </div>
                <div id="stackView" class="stack-container"></div>
              </div>
              <div class="card">
                <h4>Heap</h4>
                <div class="input-group">
                  <input id="heapInput" value="20" placeholder="Value">
                  <button onclick="addHeap()" class="btn-small primary">Alloc</button>
                  <button onclick="removeHeap()" class="btn-small danger">Free</button>
                </div>
                <div id="heapView" class="heap-container"></div>
              </div>
            </div>
          </section>

          <section id="gc" class="tab-panel">
            <div class="card">
              <h3>Garbage Collection Visualizer</h3>
              <div class="action-buttons">
                <button onclick="simulateRef()" class="btn-primary"><i class="fas fa-link"></i> Reference Graph</button>
                <button onclick="simulateMark()" class="btn-accent"><i class="fas fa-check-circle"></i> Mark Phase</button>
                <button onclick="simulateSweep()" class="btn-secondary"><i class="fas fa-broom"></i> Sweep</button>
              </div>
              <div id="gcView" class="gc-container"></div>
            </div>
          </section>

          <section id="dashboard" class="tab-panel">
            <div class="card-row">
              <div class="card chart-card">
                <h4>Algorithm Comparison</h4>
                <canvas id="algoChart"></canvas>
              </div>
              <div class="card metrics-card">
                <h4>Live Metrics</h4>
                <div id="metricsSummary" class="metrics-grid"></div>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>
  </div>

  <script src="js/memory.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/algorithms.js"></script>
  <script src="js/paging.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/stackHeap.js"></script>
  <script src="js/garbage.js"></script>
  <script>
    let demoInterval;
    let demoTimeout;
    
    window.onload = () => {
      resetMemory();
      initPaging();
      initChart();
      renderStack();
      renderHeap();
      updateSpeedDisplay();
    };

    function resetAll() {
      resetMemory();
      initPaging();
      stack = [];
      heap = [];
      pageFaults = 0;
      replacements = 0;
      renderStack();
      renderHeap();
      renderPaging();
      if (chart) chart.update();
    }

    function demoAlloc() {
      const pids = ['P1', 'P2', 'P3', 'P4', 'P5'];
      const sizes = [30, 80, 120, 60, 40];
      const algos = ['first', 'best', 'worst', 'next'];
      let idx = Math.floor(Math.random() * pids.length);
      document.getElementById('pid').value = pids[idx];
      document.getElementById('psize').value = sizes[idx];
      document.getElementById('algorithm').value = algos[Math.floor(Math.random() * algos.length)];
      allocate();
    }

    function fullDemo() {
      if (demoInterval) clearInterval(demoInterval);
      if (demoTimeout) clearTimeout(demoTimeout);
      demoAlloc();
      demoInterval = setInterval(demoAlloc, 1200);
      demoTimeout = setTimeout(() => {
        clearInterval(demoInterval);
      }, 12000);
    }

    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      localStorage.setItem('darkMode', document.body.classList.contains('dark-mode'));
    }

    if (localStorage.getItem('darkMode') === 'true') {
      document.body.classList.add('dark-mode');
      document.getElementById('darkToggle').checked = true;
    }

    function showTab(tabName) {
      document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(tabName).classList.add('active');
      event.target.classList.add('active');
    }

    function updateSpeedDisplay() {
      const slider = document.getElementById('speedSlider');
      const valueSpan = document.getElementById('speedValue');
      slider.oninput = () => {
        valueSpan.textContent = (slider.value / 1000).toFixed(1) + 's';
      };
    }

    function exportStats() {
      const stats = {
        dynamicAlloc: window.metrics,
        paging: { pageFaults, replacements, frames: numFrames }
      };
      const dataStr = JSON.stringify(stats, null, 2);
      const dataBlob = new Blob([dataStr], {type: 'application/json'});
      const url = URL.createObjectURL(dataBlob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `memory-stats-${new Date().toISOString().slice(0,10)}.json`;
      link.click();
    }
  </script>
</body>
</html>
